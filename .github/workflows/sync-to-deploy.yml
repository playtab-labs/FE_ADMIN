name: Sync to deploy repo

on:
  push:
    branches:
      - develop

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to deploy repo
        env:
          TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          git remote add deploy https://wnsjun:${TOKEN}@github.com/wnsjun/FE_ADMIN_DEPLOY.git
          git push deploy develop --force
